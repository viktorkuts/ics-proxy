{% extends "base.html" %}
{% block title %}Edit{% endblock title %}
{% block head %}
{{ super() }}
<script>
    function copy_link() {
        /* Get the text field */
        var copyText = document.getElementById("proxy_link");

        /* Copy the text inside the text field */
        navigator.clipboard.writeText(copyText.value);
    }
</script>
{% endblock head %}
{% block content %}

<h2 class="fw-bold mb-1">Hi, your link is </h2>
<div class="input-group input-group-lg">
    <input id="proxy_link" class="form-control" type="text" value="{{ root }}/{{ uuid }}/events.ics" disabled>
    <button onclick="copy_link()" class=" btn btn-outline-secondary">Copy</button>
</div>

You can simply copy and past this link into any calendar application.
<hr class="my-4">
<div class="mt-3">
    To edit where it leads to:
    <form action="edit_process">
        <input name="uuid" type="hidden" value="{{ uuid }}">
        <div class="input-group input-group-sm mb-3">
            <input class="form-control" name="link" type="text" value="{{ link }}">
        </div>
        <label for="user_agent_select" class="form-label">User-Agent sent to this calendar (leave "No override" unless the calendar needs a specific browser to work)</label>
        <div class="input-group input-group-sm mb-3">
            <select id="user_agent_select" class="form-select"
                onchange="document.getElementById('user_agent').value = this.value">
                <option value="">No override / custom (edit field below)</option>
                {% for preset in user_agent_presets %}
                <option value="{{ preset.1 }}" {% if preset.1==user_agent %}selected{% endif %}>{{ preset.0 }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="input-group input-group-sm mb-3">
            <input class="form-control" id="user_agent" name="user_agent" type="text" value="{{ user_agent }}"
                placeholder="leave empty to send no User-Agent header">
            <input class="btn btn-outline-secondary" value="Save" name="replace" type="submit">
        </div>
    </form>
    <hr class="my-4">
    <div class="d-flex justify-content-between">
        <a href="/">Back to main page</a>
        <form action="delete_process" onsubmit="return confirm('Are you sure you want to delete this link?');">
            <input name="uuid" type="hidden" value="{{ uuid }}">
            <input class="btn btn-danger" value="Delete" name="delete" type="submit">
        </form>
    </div>
</div>

{% endblock content %}
